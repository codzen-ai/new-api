# Development Docker Compose for devcontainer
# This provides the development environment with all necessary services

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: sleep infinity
    environment:
      # Database connection for development
      - SQL_DSN=postgresql://root:devpassword@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis:6379
      # Development settings
      - GIN_MODE=debug
      - TZ=Asia/Tokyo
      - PORT=3000
      - SESSION_SECRET=X#ik?er!ite
      - TRUSTED_REDIRECT_DOMAINS=google.com,baidu.com
    depends_on:
      - redis
      - postgres
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - dev-network
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: new-api
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dev-network
    ports:
      - "5432:5432"

networks:
  dev-network:
    driver: bridge

volumes:
  go-modules:
  go-build-cache:
  redis-data:
  postgres-data:
